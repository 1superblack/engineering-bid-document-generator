name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # 说明：此前此处为 `pip install -e .`，但 pyproject.toml 仅有
      # black/isort/flake8 配置、缺少 [build-system] 与 [project] 元数据，
      # 该步骤必然失败。测试通过 sys.path 直接从仓库根目录导入，无需安装。
      - name: Run lite smoke tests
        run: |
          python -m pytest test_lite.py -v --tb=short
