# pytest 配置
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -ra
    --continue-on-collection-errors
filterwarnings =
    ignore::DeprecationWarning:docx.*
markers =
    smoke: 冒烟测试（基础回归）
    unit: 单元测试
    integration: 集成测试（需要完整流程）
    slow: 较慢的测试（可选跳过）
